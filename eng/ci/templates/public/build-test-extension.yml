parameters:
  - name: fileVersion
    type: string
    default: "" # The file version of the extension to be built. This is set by the build pipeline.

jobs:
  - job: BuildExtension
    variables:
      fileVersion: ${{ parameters.fileVersion }}
    steps:
      - task: UseDotNet@2
        displayName: Acquire .NET 8.0 SDK
        inputs:
          packageType: sdk
          version: 8.0.x
          performMultiLevelLookup: true

      - task: DotNetCoreCLI@2
        displayName: Build solution
        inputs:
          command: build
          workingDirectory: extension
          arguments: --configuration Release -property:Version=$(fileVersion) -property:CommitHash=$(Build.SourceVersion)

      - task: DotNetCoreCLI@2
        displayName: Test extension
        inputs:
          command: test
          workingDirectory: extension
          arguments: --configuration Debug
