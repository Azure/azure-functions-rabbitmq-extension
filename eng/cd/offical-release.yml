trigger: none
name: $(Date:yyyyMMdd).$(Rev:r)
parameters:
  - template: templates/release-parameters.yml
resources:
  pipelines:
    - pipeline: "_rabbitmq-extensionofficial"
      project: "internal"
      source: 'azure\azure-functions-rabbitmq-extension\rabbitmq-extension.official'
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows
    stages:
      - stage: ValidateAndApprove
        displayName: Validate and Approve Release
        jobs:
          - template: templates/predeployment/validate-release.yml
          - template: templates/predeployment/approve-release.yml
      - stage: NugetPublish
        displayName: NuGet Publish
        dependsOn: ValidateAndApprove
        condition: succeeded()
        jobs:
          - template: templates/nuget-publish.yml
      - stage: MavenPublish
        displayName: Maven Publish
        dependsOn: ValidateAndApprove
        condition: succeeded()
        jobs:
          - template: templates/maven-publish.yml
